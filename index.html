<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Redaction+35:ital,wght@0,400;0,700;1,400&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <title>TicTacToe</title>
</head>
<body>
    <hr>
    <h1 id="Title">TIC TAC TOE</h1>
    <hr>
    <br>
    <div id="report"></div>
    <br>
    <div id="layout">
        <div cellIndex="0" class="box"></div>
        <div cellIndex="1" class="box"></div>
        <div cellIndex="2" class="box"></div>
        <div cellIndex="3" class="box"></div>
        <div cellIndex="4" class="box"></div>
        <div cellIndex="5" class="box"></div>
        <div cellIndex="6" class="box"></div>
        <div cellIndex="7" class="box"></div>
        <div cellIndex="8" class="box"></div>
    </div>
    <h2 id="playing"></h2>
    <br>
    <button id="restart" , class="btn">Restart</button>
    <button id="reset", class="btn">Reset</button>
    <script src="script.js"></script>
</body>
</html>
